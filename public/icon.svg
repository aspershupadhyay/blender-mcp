<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Blender MCP Relay">
  <title>Blender MCP Relay</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16121f"/>
      <stop offset="1" stop-color="#0a0b10"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset=".45" stop-color="#ff5e3a"/>
      <stop offset="1" stop-color="#d6248f"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6c5cff"/>
      <stop offset="1" stop-color="#36d6ff"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff7a3c" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff7a3c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <circle cx="128" cy="132" r="92" fill="url(#glow)"/>
  <!-- orbit: the relay path around the scene -->
  <ellipse cx="128" cy="132" rx="98" ry="38" transform="rotate(-22 128 132)" fill="none" stroke="url(#cool)" stroke-width="7" stroke-linecap="round" stroke-dasharray="320 70"/>
  <!-- isometric cube: the Blender scene -->
  <path d="M128 54 196 93v78l-68 39-68-39V93z" fill="#1d1830" stroke="url(#hot)" stroke-width="10" stroke-linejoin="round"/>
  <path d="M60 93l68 39 68-39M128 132v78" fill="none" stroke="url(#hot)" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M128 132 196 93v78l-68 39z" fill="#ff5e3a" fill-opacity=".16"/>
  <!-- signal node riding the orbit -->
  <circle cx="211" cy="94" r="15" fill="#36d6ff"/>
  <circle cx="211" cy="94" r="25" fill="none" stroke="#36d6ff" stroke-opacity=".45" stroke-width="5"/>
  <circle cx="128" cy="132" r="11" fill="#fff"/>
</svg>
